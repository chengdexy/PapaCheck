<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PapaCheck 登录</title>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f5f5f5}
.login-box{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1);width:320px}
h1{text-align:center;color:#333;font-size:1.5rem;margin-bottom:.5rem}
.desc{text-align:center;color:#666;font-size:.9rem;margin-bottom:1.5rem}
input{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:8px;font-size:1rem;box-sizing:border-box}
button{width:100%;padding:.75rem;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin-top:1rem}
button:hover{background:#45a049}
.error{color:#e74c3c;text-align:center;margin-top:.5rem;display:none}
</style>
</head>
<body>
<div class="login-box">
<h1>PapaCheck</h1>
<p class="desc">请输入您的家庭访问码</p>
<input type="text" id="accessCode" placeholder="请输入访问码" autocomplete="off">
<button onclick="login()">进入</button>
<div class="error" id="error">访问码无效，请联系管理员</div>
</div>
<script>
async function login(){var c=document.getElementById('accessCode').value.trim();if(!c)return;var r=await fetch('/api/auth/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_code:c})});if(r.ok){var d=await r.json();localStorage.setItem('papacheck_token',d.token);localStorage.setItem('papacheck_role',d.role);localStorage.setItem('papacheck_nickname',d.nickname);var p=new URLSearchParams(window.location.search);window.location.href=p.get('redirect')||'/'}else document.getElementById('error').style.display='block'}
document.getElementById('accessCode').addEventListener('keydown',function(e){if(e.key==='Enter')login()})
</script>
</body>
</html>
