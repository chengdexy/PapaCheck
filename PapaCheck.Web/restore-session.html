<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;background:#fff;

<body>
正在恢复会话，请稍候...
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var role = params.get('role');
  var childName = params.get('childName');
  var target = params.get('target') || '/';

  // 安全校验：只允许同源或相对路径跳转，防止开放重定向
  if (target && target.indexOf('://') !== -1) {
    try {
      var targetHost = target.split('/')[2];
      if (targetHost !== window.location.host) {
        target = '/';
      }
    } catch (_) {
      target = '/';
    }
  }

  if (token) {
    sessionStorage.setItem('papacheck_token', token);
    sessionStorage.setItem('papacheck_role', role || '');
    sessionStorage.setItem('papacheck_child_name', childName || '');
  }

  window.location.replace(target);
})();
</script>
</body>
</html>
