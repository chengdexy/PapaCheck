plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.chengdexy.papacheck"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.chengdexy.papacheck"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('key.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile = file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            } else {
                // 后备配置：从环境变量读取（适用于 CI/CD），或创建 android/key.properties
                storeFile = file('release.keystore')
                storePassword = System.getenv('PAPACHECK_STORE_PASSWORD')
                keyAlias = System.getenv('PAPACHECK_KEY_ALIAS')
                keyPassword = System.getenv('PAPACHECK_KEY_PASSWORD')
                if (storePassword == null || keyAlias == null || keyPassword == null) {
                    throw new GradleException(
                        "Release signing config missing: create android/key.properties " +
                        "or set PAPACHECK_STORE_PASSWORD / PAPACHECK_KEY_ALIAS / PAPACHECK_KEY_PASSWORD"
                    )
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
}
