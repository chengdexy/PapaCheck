name: papacheck_android
description: "PapaCheck 孩子端 Android 应用"
publish_to: 'none'

version: 1.2.2+28

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: '>=4.3.2 <4.3.3'
  shared_preferences: ^2.5.3
  path_provider: ^2.1.0
  open_filex: ^4.6.0
  package_info_plus: ^8.3.1
  battery_plus: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg
    - assets/web/
    - assets/web/css/
    - assets/web/js/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.jpg
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon.jpg
