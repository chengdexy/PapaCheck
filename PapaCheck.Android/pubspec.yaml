name: papacheck_android
description: "PapaCheck 孩子端 Android 应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.jpg
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon.jpg
