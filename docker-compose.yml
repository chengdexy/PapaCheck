services:
  app:
    build:
      context: ./PapaCheck.Server.Node
      dockerfile: Dockerfile
    command: ["node", "dist/index.js", "--web-dir", "/app/web", "--db-path", "/app/data/data.db"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - ./PapaCheck.Web:/app/web:ro
      - papacheck_data:/app/data
      - tts_cache:/app/tts_cache
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1536m
    oom_kill_disable: false

  landing:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped
    mem_limit: 64m

volumes:
  papacheck_data:
  tts_cache:
